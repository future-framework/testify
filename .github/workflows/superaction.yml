# stretchr/testify's .github/workflows/main.yml: build (go_version: stable), for the Superaction scoreboard.
name: Superaction

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: test / superaction-fabric
    runs-on: superaction-fabric
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: ./.ci.gogenerate.sh
      - run: ./.ci.gofmt.sh
      - run: ./.ci.govet.sh
      - run: go test -v -race ./...
